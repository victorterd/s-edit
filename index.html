<!doctype html>
<html lang="ro">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S-EDIT © — Studio de editare video</title>
  <meta name="description" content="S-Edit este un studio de editare video dedicat brandurilor și creatorilor care vor conținut care atrage și convinge.">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

<body>
  <div class="bg" aria-hidden="true">
    <video class="bg__video" src="assets/background.mp4?v=3" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

  <main class="hero">

      <a class="brand" href="/">S-EDIT ©</a>

        <span></span><span></span>

    <h1 class="hero__logo">
      <img src="assets/logo.svg" width="672" height="351" alt="S-Edit">
    </h1>

    <footer class="hero__bottom">
      <a class="social" href="https://www.instagram.com/" target="_blank" rel="noopener">INSTAGRAM</a>
      <p class="tagline">
        S-EDIT ESTE UN STUDIO DE EDITARE VIDEO DEDICAT BRANDURILOR<br class="br-desktop">

      </p>
      <a class="mail" href="mailto:hello@s-edit.ro">EMAIL ME</a>
    </footer>
  </main>

  <div class="menu" id="menu" hidden>
    <nav class="menu__links" aria-label="Meniu mobil">
      <a href="#portofoliu">PORTOFOLIU</a>
      <a href="#contact">CONTACT</a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">INSTAGRAM</a>
      <a href="mailto:hello@s-edit.ro">EMAIL ME</a>
    </nav>
  </div>

  <script src="main.js?v=3" defer></script>
